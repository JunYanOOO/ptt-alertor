name: ptt-alertor
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DB_CONNECTION: http://dynamodb:8000
      REDIS_ENDPOINT: redis
      REDIS_PORT: "6379"
      APP_HOST: ${APP_HOST:-http://localhost:19090}
      APP_WS_HOST: ${APP_WS_HOST:-ws://localhost:19090/ws}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PW: ${AUTH_PW:-change-me}
      BOARD_HIGH: ${BOARD_HIGH:-}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESSTOKEN: ${LINE_CHANNEL_ACCESSTOKEN:-}
      LINE_CLIENT_ID: ${LINE_CLIENT_ID:-}
      LINE_CLIENT_SECRET: ${LINE_CLIENT_SECRET:-}
      MESSENGER_ACCESSTOKEN: ${MESSENGER_ACCESSTOKEN:-}
      MESSENGER_VERIFYTOKEN: ${MESSENGER_VERIFYTOKEN:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_APIKEY: ${MAILGUN_APIKEY:-}
      MAILGUN_PUBLIC_APIKEY: ${MAILGUN_PUBLIC_APIKEY:-}
      S3_DOMAIN: ${S3_DOMAIN:-}
    ports:
      - ${APP_PORT:-19090}:9090
      - ${GOPS_PORT:-16060}:6060
    volumes:
      - app-storage:/app/storage
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      dynamodb:
        condition: service_started
    stop_grace_period: 10s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
  dynamodb:
    image: amazon/dynamodb-local:latest
    restart: unless-stopped
    user: root
    working_dir: /home/dynamodblocal
    command:
      - -jar
      - DynamoDBLocal.jar
      - -sharedDb
      - -dbPath
      - ./data
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
volumes:
  app-storage: null
  redis-data: null
  dynamodb-data: null
networks: {}
